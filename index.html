<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Inspection Notes</title>
<style>
:root{--navy:#1f4e79;--blue:#2e75b6;--bg:#f2f4f7;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#d9dee6;
  --ok:#2e7d32;--okb:#e8f5e9;--bad:#c62828;--badb:#fdecea;--warn:#b26a00;--warnb:#fff4e0;--sel:#1f4e79}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.85;font-weight:400}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:15px}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 90px);max-width:720px;margin:0 auto}
h2{font-size:15px;margin:18px 2px 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.3px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.card.bad{border-left:5px solid var(--bad)} .card.warn{border-left:5px solid var(--warn)} .card.good{border-left:5px solid var(--ok)}
.card h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ptext{font-size:14px;margin:0 0 8px;color:#222}
label.f{display:block;font-size:12px;color:var(--mut);margin:0 0 8px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:3px;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
label.f>textarea{min-height:90px;resize:vertical}
input[readonly]{background:#f6f7f9;color:#444}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 8px}
.seg button{flex:1 1 auto;min-width:56px;padding:9px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.seg button.on.badv{background:var(--bad);border-color:var(--bad)}
.seg button.on.warnv{background:var(--warn);border-color:var(--warn)}
.segl{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1px solid var(--line);background:#f7f9fc;border-radius:16px;padding:6px 10px;font-size:13px;color:#333;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;text-align:center}
.btn.full{display:block;width:100%;margin:6px 0}
.btn.green{background:var(--ok)} .btn.red{background:var(--bad)} .btn.grey{background:#6b7280} .btn.light{background:#e8eef6;color:var(--navy)}
.btn.small{padding:7px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(16,24,40,.08);min-height:92px}
.tile b{display:block;color:var(--navy);font-size:15px}
.tile span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.tile .flag{color:var(--bad);font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;background:#eef2f7;color:#444}
.badge.bad{background:var(--badb);color:var(--bad)} .badge.warn{background:var(--warnb);color:var(--warn)} .badge.ok{background:var(--okb);color:var(--ok)}
.calc{font-size:13px;color:#333;background:#f6f7f9;border-radius:8px;padding:7px 9px;margin:0 0 8px}
.list .item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.search{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.dist{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line)}
.dist.on{border:2px solid var(--blue);background:#eef5fc}
.sqc{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:end}
.sqc input,.sqc select{width:100%;font-size:16px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sqc .n{font-weight:700;color:var(--navy);padding-bottom:9px}
.tiny{font-size:11px;color:var(--mut)}
.phot{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.phot img{width:64px;height:64px;object-fit:cover;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%}
#toast.show{opacity:.92}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;z-index:15}
.foot .btn{flex:1;padding:11px 6px;font-size:15px}
#printv{display:none}
@media print{header,main,.foot,#toast{display:none!important}#printv{display:block}
  #printv .ph{break-inside:avoid;margin:0 0 14px;font:12px Arial}#printv img{max-width:100%;max-height:420px}}
</style>
</head>

/* ---------------- storage ---------------- */
var S={setup:null,insp:{}};
function load(){try{S.setup=JSON.parse(localStorage.getItem('insp.setup')||'null');S.insp=JSON.parse(localStorage.getItem('insp.data')||'{}');}catch(e){S.insp={};}}
var saveT=null;

function saveSetup(){try{localStorage.setItem('insp.setup',JSON.stringify(S.setup));return true;}catch(e){return false;}}
// photos in IndexedDB
var idb=null;
function db(){return new Promise(function(res,rej){if(idb)return res(idb);var r=indexedDB.open('insp-photos',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('p',{keyPath:'id'});};r.onsuccess=function(){idb=r.result;res(idb);};r.onerror=function(){rej(r.error);};});}
function pPut(o){return db().then(function(d){return new Promise(function(res){var t=d.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;});});}
function pAll(insp){return db().then(function(d){return new Promise(function(res){var out=[];var t=d.transaction('p');var c=t.objectStore('p').openCursor();
  c.onsuccess=function(){var cu=c.result;if(cu){if(cu.value.insp===insp)out.push(cu.value);cu.continue();}else res(out);};});});}
function pDel(id){return db().then(function(d){return new Promise(function(res){var t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;});});}

/* ---------------- helpers ---------------- */
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function num(v){var x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?null:x;}

/* ---------------- calculations (same rules as the Excel template) ---------------- */
function limitsFor(t){var L=(S.setup&&S.setup.limits)||LIM;for(var i=0;i<L.length;i++)if(String(L[i][0])===String(t))return L[i];return [t,-142,142];}
function dptDue(d){var m=String(d||'').toUpperCase().match(/^([A-D])-(\d{2})$/);if(!m)return null;var q='ABCD'.indexOf(m[1]);return new Date(2000+ +m[2],(q+1)*3,0);}
function sqc(i){
  var t=V('3|DDEquipmentType'+i)||'',tare=num(V('3|txtTareWt'+i)),obs=num(V('3|txtObservedWt'+i));
  var o={gross:null,vari:null,check:''};
  if(tare!=null&&t!=='')o.gross=r2(tare+parseFloat(t));
  if(o.gross!=null&&obs!=null)o.vari=Math.round((obs-o.gross)*1000);
  if(o.vari!=null){var L=limitsFor(t);if(o.vari<L[1])o.check='Underweight';else if(o.vari>L[2])o.check='Overweight';}
  var due=dptDue(V('3|txtDPTDate'+i));if(due&&cur&&new Date(cur.date)>due)o.check=(o.check?o.check+' ':'')+'DPT overdue';
  return o;
}
function excess(p,i){var a=p==='4'?num(V('4|txtAmtAsMemo'+i)):num(V('5|lblTotalAmountARBBill'+i)),b=p==='4'?num(V('4|txtAmtColltAsCustomer'+i)):num(V('5|txtAmountCollectedCustomer'+i));return(a!=null&&b!=null)?r2(b-a):null;}
function infra(){
  var o={cap:0,trips:0,dc:0,rows:{}};
  for(var i=0;i<20;i++){if(!V('7|rptVehicleDetail_txtVehicleNo_'+i))continue;
    var c=num(V('7|rptVehicleDetail_txtCapacity_'+i))||0,t=num(V('7|rptVehicleDetail_txtTripCount_'+i))||0;
    var d=V('7|rptVehicleDetail_ddInspectionVerification_'+i)==='Yes'?c*t*25:0;o.rows[i]=d;o.cap+=c;o.trips+=t;o.dc+=d;}
  var h=num(V('7|txtCustomerHolding')),r=num(String(V('7|ddTargetRefillDeliveryRatio')).replace('%',''));
  o.target=(h!=null&&r!=null)?Math.round(h*r/100):null;o.avail=o.dc;

  v.onchange=function(e){var el=e.target;if(!el.dataset.k)return;onVal(p,el.dataset.k,el,true);};
  v.onclick=function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.seg){var k=b.dataset.seg,val=b.dataset.val;setV(k,V(k)===val?'':val);refresh();return;}
    if(b.dataset.chip){var ck=b.dataset.chip,cv=b.dataset.val;var inpEl=v.querySelector('input[data-k="'+ck+'"]');var nv=V(ck)?V(ck)+'. '+cv:cv;if(cv==='Ok'||cv==='OK')nv=cv;
      setV(ck,nv);if(inpEl)inpEl.value=nv;return;}
    if(b.dataset.cam){takePhoto(b.dataset.cam);return;}
    if(b.id==='allok'){var n=0;Object.keys(G2).forEach(function(g){for(var i=0;i<P2[g].length;i++){var k='2|'+G2[g][0]+i;if(!V(k)){setV(k,'Ok');n++;}}});toast(n+' set to Ok');refresh();return;}
    if(b.id==='nilnc'){nilNC();return;}
    if(b.id==='addv'){var P='7|rptVehicleDetail_',i=0;while(i<20&&V(P+'txtVehicleNo_'+i))i++;if(i<20){setV(P+'txtVehicleNo_'+i,'NEW');setV(P+'ddInspectionVerification_'+i,'Yes');rerender();toast('Vehicle added - type its number');}return;}
  };
  if(p==='2')showThumbs();

function onVal(p,k,el,committed){
  var t=el.dataset.t,v=el.value;
  if(t==='date')v=v?'D:'+v:'';
  if(t==='dpt'){v=v.toUpperCase().replace(/\s/g,'');if(committed&&v&&!/^[A-D]-\d{2}$/.test(v))toast('DPT should look like A-28');}
  setV(k,v);
  // defaults
  if(p==='3'){var m=k.match(/^3\|txtTareWt(\d+)$/);if(m&&v){var i=m[1];if(!V('3|DDEquipmentType'+i))setV('3|DDEquipmentType'+i,'14.2');if(!V('3|DDMissingSeal'+i))setV('3|DDMissingSeal'+i,'No');if(!V('3|DDLeaky'+i))setV('3|DDLeaky'+i,'No');}
    var mm=k.match(/^3\|(txtTareWt|txtObservedWt|txtDPTDate)(\d+)$/);if(mm){var j=mm[2],s=sqc(j);var r=V('3|txtRemark'+j);if(V('3|txtTareWt'+j)&&(r===''||r==='OK'||/weight|DPT/.test(r))){setV('3|txtRemark'+j,s.check||'OK');refreshInputs(['3|txtRemark'+j]);}}}
  var mc=k.match(/^([45])\|(txtCustomerNo|txtCustomerNumber)(\d+)$/);
  if(mc&&v&&committed){var pp=mc[1],ii=mc[3],D=pp==='4'?((S.setup&&S.setup.def4)||DEF4):((S.setup&&S.setup.def5)||DEF5),changed=[];
    Object.keys(pp==='4'?DEF4:DEF5).forEach(function(bk){if(!V(pp+'|'+bk+ii)&&D[bk]){setV(pp+'|'+bk+ii,D[bk]);changed.push(pp+'|'+bk+ii);}});
    if(pp==='4'&&!V('4|txtCustomerTypet'+ii)){}
    appendNextCard(pp,+ii);}
  refresh();
}

var camKey=null;
function takePhoto(k){camKey=k;var c=$('#camin');c.value='';c.onchange=function(){var f=c.files[0];if(!f)return;shrink(f,1280,0.6).then(function(blob){

function shrink(file,max,q){return new Promise(function(res){var img=new Image();img.onload=function(){var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
  var cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(function(b){URL.revokeObjectURL(img.src);res(b);},'image/jpeg',q);};img.src=URL.createObjectURL(file);});}
function showThumbs(){pAll(cur.id).then(function(ps){document.querySelectorAll('[data-ph]').forEach(function(d){d.innerHTML='';});
  ps.forEach(function(p){var d=document.querySelector('[data-ph="'+p.key+'"]');if(d){var im=document.createElement('img');im.src=URL.createObjectURL(p.blob);im.title='Tap to delete';
    im.onclick=function(){if(confirm('Delete this photo?'))pDel(p.id).then(showThumbs);};d.appendChild(im);}});});}

/* ---------------- export (same format as Excel "Export for Portal") ---------------- */
function jstr(s){return JSON.stringify(String(s)).replace(/[\u007f-\uffff]/g,function(c){return '\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4);});}
function doExport(){
  if(!cur)return;
  // defaults that Excel would also fill (sheet 3: OK remarks; sheets 4/5 already set on entry)
  for(var i=1;i<=20;i++)if(V('3|txtTareWt'+i)&&!V('3|txtRemark'+i))setV('3|txtRemark'+i,sqc(i).check||'OK');
  var vals={};Object.keys(cur.v).forEach(function(k){vals[k]=cur.v[k];});
  var c=calcValues();Object.keys(c).forEach(function(k){if(F[k])vals[k]=c[k];});
  var lines=[],keys=Object.keys(vals).filter(function(k){return F[k]&&String(vals[k]).trim()!=='';});
  keys.sort(function(a,b){return ORD[a]-ORD[b];});
  keys.forEach(function(k){var f=F[k],pk=k.split('|');
    lines.push('{"p":'+jstr(pk[0])+',"k":'+jstr(pk[1])+',"t":'+jstr(f.t)+',"b":'+f.b+',"l":'+jstr(f.l)+',"v":'+jstr(vals[k])+'}');});
  var d=new Date(),stamp=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  var txt='{"v":1,"src":"mobile","code":'+jstr(cur.code)+',"name":'+jstr(cur.name)+',"date":'+jstr(cur.date)+',"exported":'+jstr(stamp)+',"fields":[\n'+lines.join(',\n')+'\n]}\n';
  var name=cur.code+'_'+cur.date+'_mobile.json';
  var file=new File([txt],name,{type:'application/json'});
  function done(){cur.exported=stamp;save(true);toast('Exported '+keys.length+' entries');if(location.hash.indexOf('#/i/')<0)vHome();}
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(done).catch(function(e){if(e&&e.name!=='AbortError')fallback();});
  }else fallback();
  function fallback(){var a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();done();}
}
